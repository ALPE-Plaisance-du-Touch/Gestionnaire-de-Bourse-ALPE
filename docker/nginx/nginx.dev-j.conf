# Environnement de test dev-j - Bourse ALPE
#
# Pas de TLS ici : Traefik termine le HTTPS et relaie en clair vers ces deux
# ports. Aucun certificat, aucun nom de domaine en dur, donc rien à modifier si
# le domaine change.

# Traefik masque l'adresse du visiteur derrière celle du réseau Docker. Sans
# cette reconstitution, la limitation de débit compte toutes les requêtes de
# tout le monde sur un seul et même compteur.
# La plage ci-dessous couvre le pool d'adresses Docker par défaut ; à ajuster
# si le démon a été configuré sur une autre plage.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# --- Application ---
server {
    listen 8080;
    server_name _;

    include /etc/nginx/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Routage du SPA : toute URL inconnue retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le service worker ne doit jamais être mis en cache, sinon une mise à jour
    # de l'application ne parvient pas aux navigateurs déjà venus.
    location /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Génération de PDF et imports peuvent être longs
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# --- MailHog ---
# MailHog n'a aucune authentification propre et affiche tous les courriels,
# jetons d'invitation et liens de réinitialisation compris. L'accès est donc
# protégé ici.
server {
    listen 8081;
    server_name _;

    auth_basic "Bourse ALPE - courriels de test";
    auth_basic_user_file /etc/nginx/mailhog.htpasswd;

    location / {
        proxy_pass http://mailhog:8025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # L'interface se met à jour en direct via websocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
