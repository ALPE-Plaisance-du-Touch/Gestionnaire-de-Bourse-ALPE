<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0}.tile{width:1280px;height:854px;display:grid;grid-template-columns:1fr 300px}.main{background:var(--blue-500);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}.main img{width:62%}.sig{font-family:Grandstander,system-ui,sans-serif;font-weight:600;font-size:210px;line-height:1;color:#fff}.sig i{font-style:normal;color:var(--yellow-500)}.strip{display:grid;grid-template-rows:repeat(3,1fr)}</style>
</head><body>
<div class="tile">
<div class="main"><img src="assets/logo-v2-mark-reversed.svg" alt=""><div class="sig">A<i>L</i>PE</div></div>
<div class="strip"><div style="background:var(--yellow-500)"></div><div style="background:var(--orange-500)"></div><div style="background:var(--blue-800)"></div></div>
</div>
</body></html>
