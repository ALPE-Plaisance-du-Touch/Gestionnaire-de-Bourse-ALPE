<!-- @dsCard group="Colors" viewport="700x150" name="Retours système" subtitle="Succès, alerte, erreur, information — tenus proches de la marque" -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:20px;font-family:var(--font-body)}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.sw{border-radius:var(--radius-sm);height:64px;flex:1;min-width:52px;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box}.lbl{font-size:10px;font-family:var(--font-mono);color:var(--text-muted);margin-top:6px;letter-spacing:.02em}.cap{font-size:var(--text-2xs);color:var(--text-muted)}.stack{display:flex;flex-direction:column;gap:4px;flex:1}</style>
</head><body><div class="row"><div class="stack"><div class="sw" style="background:var(--success-bg);color:var(--success-fg);align-items:center;justify-content:center;font-weight:700;font-size:13px">Succès</div><div class="lbl">--success-fg / --success-bg</div></div><div class="stack"><div class="sw" style="background:var(--warning-bg);color:var(--warning-fg);align-items:center;justify-content:center;font-weight:700;font-size:13px">Alerte</div><div class="lbl">--warning-fg / --warning-bg</div></div><div class="stack"><div class="sw" style="background:var(--danger-bg);color:var(--danger-fg);align-items:center;justify-content:center;font-weight:700;font-size:13px">Erreur</div><div class="lbl">--danger-fg / --danger-bg</div></div><div class="stack"><div class="sw" style="background:var(--info-bg);color:var(--info-fg);align-items:center;justify-content:center;font-weight:700;font-size:13px">Info</div><div class="lbl">--info-fg / --info-bg</div></div></div></body></html>
