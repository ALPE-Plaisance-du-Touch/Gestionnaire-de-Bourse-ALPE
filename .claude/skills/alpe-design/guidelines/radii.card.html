<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:20px;font-family:var(--font-body)}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.sw{border-radius:var(--radius-sm);height:64px;flex:1;min-width:52px;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box}.lbl{font-size:10px;font-family:var(--font-mono);color:var(--text-muted);margin-top:6px;letter-spacing:.02em}.cap{font-size:var(--text-2xs);color:var(--text-muted)}.stack{display:flex;flex-direction:column;gap:4px;flex:1}</style>
</head><body><div class="row"><div class="stack" style="align-items:center"><div style="width:76px;height:64px;background:var(--blue-100);border:2px solid var(--blue-500);border-radius:var(--radius-xs)"></div><div class="lbl">xs · 4px</div></div><div class="stack" style="align-items:center"><div style="width:76px;height:64px;background:var(--blue-100);border:2px solid var(--blue-500);border-radius:var(--radius-sm)"></div><div class="lbl">sm · 8px</div></div><div class="stack" style="align-items:center"><div style="width:76px;height:64px;background:var(--blue-100);border:2px solid var(--blue-500);border-radius:var(--radius-md)"></div><div class="lbl">md · 12px</div></div><div class="stack" style="align-items:center"><div style="width:76px;height:64px;background:var(--blue-100);border:2px solid var(--blue-500);border-radius:var(--radius-lg)"></div><div class="lbl">lg · 18px</div></div><div class="stack" style="align-items:center"><div style="width:76px;height:64px;background:var(--blue-100);border:2px solid var(--blue-500);border-radius:var(--radius-xl)"></div><div class="lbl">xl · 24px</div></div><div class="stack" style="align-items:center"><div style="width:76px;height:64px;background:var(--blue-100);border:2px solid var(--blue-500);border-radius:var(--radius-2xl)"></div><div class="lbl">2xl · 32px</div></div><div class="stack" style="align-items:center"><div style="width:76px;height:64px;background:var(--blue-100);border:2px solid var(--blue-500);border-radius:var(--radius-pill)"></div><div class="lbl">pill · 999px</div></div></div></body></html>
