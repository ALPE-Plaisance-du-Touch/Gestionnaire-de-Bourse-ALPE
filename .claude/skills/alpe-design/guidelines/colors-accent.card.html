<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:20px;font-family:var(--font-body)}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.sw{border-radius:var(--radius-sm);height:64px;flex:1;min-width:52px;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box}.lbl{font-size:10px;font-family:var(--font-mono);color:var(--text-muted);margin-top:6px;letter-spacing:.02em}.cap{font-size:var(--text-2xs);color:var(--text-muted)}.stack{display:flex;flex-direction:column;gap:4px;flex:1}</style>
</head><body><div class="row"><div class="stack"><div class="sw" style="background:var(--yellow-300)"></div><div class="lbl">yellow-300<br>#fff08a</div></div><div class="stack"><div class="sw" style="background:var(--yellow-400)"></div><div class="lbl">yellow-400<br>#ffe74d</div></div><div class="stack"><div class="sw" style="background:var(--yellow-500)"></div><div class="lbl">yellow-500<br>#ffe000</div></div><div class="stack"><div class="sw" style="background:var(--yellow-600)"></div><div class="lbl">yellow-600<br>#e6c800</div></div><div class="stack" style="flex:2;padding-left:16px"><div style="font-family:var(--font-display);font-size:26px;font-weight:800;color:var(--blue-800);position:relative;display:inline-block">Bourse aux vêtements<span style="position:absolute;left:0;right:0;bottom:2px;height:8px;background:var(--yellow-500);z-index:-1;border-radius:4px"></span></div><div class="lbl">soulignement jaune, z-index négatif</div></div></div></body></html>
