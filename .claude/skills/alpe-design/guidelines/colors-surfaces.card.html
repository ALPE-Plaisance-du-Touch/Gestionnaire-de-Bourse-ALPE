<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:20px;font-family:var(--font-body)}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.sw{border-radius:var(--radius-sm);height:64px;flex:1;min-width:52px;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box}.lbl{font-size:10px;font-family:var(--font-mono);color:var(--text-muted);margin-top:6px;letter-spacing:.02em}.cap{font-size:var(--text-2xs);color:var(--text-muted)}.stack{display:flex;flex-direction:column;gap:4px;flex:1}</style>
</head><body><div class="row"><div class="stack"><div class="sw" style="background:var(--surface-page);color:var(--text-body);border:1px solid var(--border-subtle);align-items:center;justify-content:center;font-size:12px;font-weight:600">page</div><div class="lbl">--surface-page</div></div><div class="stack"><div class="sw" style="background:var(--surface-muted);color:var(--text-body);border:1px solid var(--border-subtle);align-items:center;justify-content:center;font-size:12px;font-weight:600">muted</div><div class="lbl">--surface-muted</div></div><div class="stack"><div class="sw" style="background:var(--surface-brand-soft);color:var(--blue-800);border:1px solid var(--border-subtle);align-items:center;justify-content:center;font-size:12px;font-weight:600">brand soft</div><div class="lbl">--surface-brand-soft</div></div><div class="stack"><div class="sw" style="background:var(--surface-secondary-soft);color:var(--orange-800);border:1px solid var(--border-subtle);align-items:center;justify-content:center;font-size:12px;font-weight:600">orange soft</div><div class="lbl">--surface-secondary-soft</div></div><div class="stack"><div class="sw" style="background:var(--surface-brand);color:var(#fff);border:1px solid var(--border-subtle);align-items:center;justify-content:center;font-size:12px;font-weight:600">brand</div><div class="lbl">--surface-brand</div></div><div class="stack"><div class="sw" style="background:var(--surface-inverse);color:var(#fff);border:1px solid var(--border-subtle);align-items:center;justify-content:center;font-size:12px;font-weight:600">inverse</div><div class="lbl">--surface-inverse</div></div></div></body></html>
