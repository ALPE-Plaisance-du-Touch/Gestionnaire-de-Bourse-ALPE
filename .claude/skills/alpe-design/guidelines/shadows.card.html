<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:20px;font-family:var(--font-body)}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.sw{border-radius:var(--radius-sm);height:64px;flex:1;min-width:52px;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box}.lbl{font-size:10px;font-family:var(--font-mono);color:var(--text-muted);margin-top:6px;letter-spacing:.02em}.cap{font-size:var(--text-2xs);color:var(--text-muted)}.stack{display:flex;flex-direction:column;gap:4px;flex:1}</style>
</head><body><div class="row" style="padding:14px 0"><div class="stack" style="align-items:center"><div style="width:92px;height:64px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-xs)"></div><div class="lbl">shadow-xs</div></div><div class="stack" style="align-items:center"><div style="width:92px;height:64px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-sm)"></div><div class="lbl">shadow-sm</div></div><div class="stack" style="align-items:center"><div style="width:92px;height:64px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-md)"></div><div class="lbl">shadow-md</div></div><div class="stack" style="align-items:center"><div style="width:92px;height:64px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-lg)"></div><div class="lbl">shadow-lg</div></div><div class="stack" style="align-items:center"><div style="width:92px;height:64px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-xl)"></div><div class="lbl">shadow-xl</div></div><div class="stack" style="align-items:center"><div style="width:92px;height:64px;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-focus)"></div><div class="lbl">focus</div></div></div></body></html>
