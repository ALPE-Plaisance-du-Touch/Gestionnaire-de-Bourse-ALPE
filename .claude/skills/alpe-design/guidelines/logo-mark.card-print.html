<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
*{animation-delay:-99s !important;animation-duration:.001s !important;animation-iteration-count:1 !important;animation-fill-mode:both !important;animation-play-state:running !important;transition-duration:0s !important}
doc-page:not(:defined){visibility:hidden}
body{font-family:var(--font-body)}
h1{font-family:var(--font-heading);font-size:20pt;margin:0 0 2px;color:var(--text-heading)}
.sub{font-size:9pt;color:var(--text-muted);margin:0 0 22px}
.grp{display:flex;gap:24px;align-items:center;break-inside:avoid}
.cap{font-size:8pt;font-family:var(--font-mono);color:var(--text-muted);margin-top:8px}
a{color:var(--brand-primary)}a:hover{color:var(--brand-primary-hover)}</style>
</head><body>
<doc-page margin="0.75in">
<h1>Pictogramme</h1>
<p class="sub">Les deux visages seuls — avatar réseaux sociaux, favicon.</p>
<div class="grp">
<div><img src="../assets/logo-v2-mark.svg" alt="Pictogramme ALPE" style="height:110px"><div class="cap">Pictogramme</div></div>
<div><img src="../assets/logo-v2-square.svg" alt="Tuile ALPE" style="height:110px;border-radius:var(--radius-lg);border:1px solid var(--border-subtle)"><div class="cap">Tuile 512×512</div></div>
<div><img src="../assets/logo-v2-mark.svg" alt="Avatar ALPE" style="height:84px;width:84px;object-fit:contain;background:#fff;border-radius:50%;border:1px solid var(--border-subtle);padding:6px"><div class="cap">Avatar rond</div></div>
</div>
</doc-page>
<script src="../doc-page.js"></script>
</body></html>
