<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:20px;font-family:var(--font-body)}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.sw{border-radius:var(--radius-sm);height:64px;flex:1;min-width:52px;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box}.lbl{font-size:10px;font-family:var(--font-mono);color:var(--text-muted);margin-top:6px;letter-spacing:.02em}.cap{font-size:var(--text-2xs);color:var(--text-muted)}.stack{display:flex;flex-direction:column;gap:4px;flex:1}</style>
</head><body><div class="row"><div class="stack"><div class="sw" style="background:var(--white)"></div><div class="lbl">white<br>#ffffff</div></div><div class="stack"><div class="sw" style="background:var(--grey-25)"></div><div class="lbl">grey-25<br>#fafbfc</div></div><div class="stack"><div class="sw" style="background:var(--grey-50)"></div><div class="lbl">grey-50<br>#f4f7f9</div></div><div class="stack"><div class="sw" style="background:var(--grey-100)"></div><div class="lbl">grey-100<br>#e9eef2</div></div><div class="stack"><div class="sw" style="background:var(--grey-200)"></div><div class="lbl">grey-200<br>#d7dfe6</div></div><div class="stack"><div class="sw" style="background:var(--grey-300)"></div><div class="lbl">grey-300<br>#b7c3cc</div></div><div class="stack"><div class="sw" style="background:var(--grey-400)"></div><div class="lbl">grey-400<br>#8d9aa5</div></div><div class="stack"><div class="sw" style="background:var(--grey-500)"></div><div class="lbl">grey-500<br>#6b7883</div></div><div class="stack"><div class="sw" style="background:var(--grey-700)"></div><div class="lbl">grey-700<br>#3a444c</div></div><div class="stack"><div class="sw" style="background:var(--grey-900)"></div><div class="lbl">grey-900<br>#161c20</div></div></div></body></html>
