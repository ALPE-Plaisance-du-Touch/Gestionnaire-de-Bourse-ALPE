<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:20px;font-family:var(--font-body)}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.sw{border-radius:var(--radius-sm);height:64px;flex:1;min-width:52px;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box}.lbl{font-size:10px;font-family:var(--font-mono);color:var(--text-muted);margin-top:6px;letter-spacing:.02em}.cap{font-size:var(--text-2xs);color:var(--text-muted)}.stack{display:flex;flex-direction:column;gap:4px;flex:1}</style>
</head><body><div style="display:flex;gap:28px;align-items:flex-start"><div><div style="font-size:20px;font-weight:700;color:var(--text-heading);font-family:var(--font-heading)">Titre</div><div class="lbl">--text-heading</div></div><div><div style="font-size:20px;font-weight:700;color:var(--text-strong);font-family:var(--font-heading)">Fort</div><div class="lbl">--text-strong</div></div><div><div style="font-size:20px;font-weight:700;color:var(--text-body);font-family:var(--font-heading)">Courant</div><div class="lbl">--text-body</div></div><div><div style="font-size:20px;font-weight:700;color:var(--text-muted);font-family:var(--font-heading)">Discret</div><div class="lbl">--text-muted</div></div><div><div style="font-size:20px;font-weight:700;color:var(--text-subtle);font-family:var(--font-heading)">Ténu</div><div class="lbl">--text-subtle</div></div><div><div style="font-size:20px;font-weight:700;color:var(--text-link);font-family:var(--font-heading)">Lien</div><div class="lbl">--text-link</div></div></div></body></html>
