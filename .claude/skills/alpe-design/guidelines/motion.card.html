<!-- @dsCard group="Brand" viewport="700x170" name="Mouvement" subtitle="Fondu + 8px vers le haut, 220ms, ease-out. Survol 150ms." -->
<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{padding:20px;font-family:var(--font-body)}.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.sw{border-radius:var(--radius-sm);height:64px;flex:1;min-width:52px;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box}.lbl{font-size:10px;font-family:var(--font-mono);color:var(--text-muted);margin-top:6px;letter-spacing:.02em}.cap{font-size:var(--text-2xs);color:var(--text-muted)}.stack{display:flex;flex-direction:column;gap:4px;flex:1}</style>
</head><body><style>@keyframes rise{0%{opacity:0;transform:translateY(8px)}60%,100%{opacity:1;transform:none}}.d{animation:rise 2.4s var(--ease-out) infinite}</style><div class="row"><div class="stack" style="align-items:center"><div class="d" style="animation-delay:0s;width:92px;height:56px;background:var(--blue-500);border-radius:var(--radius-md)"></div><div class="lbl">instant · 90ms</div></div><div class="stack" style="align-items:center"><div class="d" style="animation-delay:0.12s;width:92px;height:56px;background:var(--blue-500);border-radius:var(--radius-md)"></div><div class="lbl">fast · 150ms</div></div><div class="stack" style="align-items:center"><div class="d" style="animation-delay:0.24s;width:92px;height:56px;background:var(--blue-500);border-radius:var(--radius-md)"></div><div class="lbl">base · 220ms</div></div><div class="stack" style="align-items:center"><div class="d" style="animation-delay:0.36s;width:92px;height:56px;background:var(--blue-500);border-radius:var(--radius-md)"></div><div class="lbl">slow · 360ms</div></div></div><div class="lbl">--ease-out cubic-bezier(.22,.72,.24,1) · --press-scale .98</div></body></html>
