<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>ALPE — Site web</title>
<link rel="icon" href="../../assets/logo-v2-square.svg">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html{scroll-behavior:smooth}li{margin-bottom:6px}</style>
</head><body>
<div id="root"></div>
<script type="text/babel" data-presets="react" src="SiteChrome.jsx"></script>
<script type="text/babel" data-presets="react" src="HomeScreen.jsx"></script>
<script type="text/babel" data-presets="react" src="AssociationScreen.jsx"></script>
<script type="text/babel" data-presets="react" src="BourseScreen.jsx"></script>
<script type="text/babel" data-presets="react" src="AdhesionScreen.jsx"></script>
<script type="text/babel" data-presets="react">
function App(){
  const [route,setRoute]=React.useState('home');
  const go=(r)=>{setRoute(r);window.scrollTo({top:0});};
  const Screen = route==='association'?window.AssociationScreen:route==='bourse'?window.BourseScreen:route==='adhesion'?window.AdhesionScreen:window.HomeScreen;
  return (<React.Fragment>
    <window.SiteHeader route={route} go={go}/>
    <Screen go={go}/>
    <window.SiteFooter/>
  </React.Fragment>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
