<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Réseaux sociaux — post & story" description="Post carré 1080×1080 et story 1080×1920 aux couleurs ALPE, prêts à exporter." -->
<helmet>
<script src="./ds-base.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>body{margin:0;background:#e9eef2}</style>
</helmet>
<div style="min-height:100vh;padding:40px;display:flex;gap:40px;align-items:flex-start;justify-content:center;font-family:'Nunito',system-ui,sans-serif;flex-wrap:wrap">

<div style="flex:0 0 auto">
<div style="font-family:'Quicksand',system-ui,sans-serif;font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#6b7883;margin-bottom:12px">Post carré — 1080 × 1080</div>
<div style="width:540px;height:540px;background:#00a0d0;border-radius:18px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 10px 28px rgba(3,59,83,.12)">
<div style="position:absolute;left:-40px;right:-40px;bottom:96px;opacity:.55"><svg viewBox="0 0 620 90" preserveAspectRatio="none" aria-hidden="true" style="width:100%;height:110px"><path d="M4 78 C 150 22 420 6 616 12" fill="none" stroke="#ffe000" stroke-width="9" stroke-linecap="round"></path></svg></div>
<div style="position:relative;padding:34px 38px 0"><img src="../../assets/logo-alpe-v2-horizontal.png" alt="ALPE" style="height:64px;background:#fff;border-radius:10px;padding:8px 12px"></div>
<div style="position:relative;padding:26px 38px 0;flex:1;display:flex;flex-direction:column">
<div style="align-self:flex-start;background:#ffe000;color:#161c20;border-radius:999px;padding:6px 16px;font-family:'Quicksand',system-ui,sans-serif;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase">{{ kicker }}</div>
<div style="margin-top:18px;font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:52px;line-height:1.03;color:#ffffff;text-wrap:pretty">{{ title }}</div>
<div style="margin-top:16px;font-size:21px;line-height:1.35;color:rgba(255,255,255,.92);max-width:400px">{{ line }}</div>
</div>
<div style="position:relative;background:#ffffff;padding:20px 38px;display:flex;align-items:center;justify-content:space-between;gap:16px">
<div style="font-family:'Quicksand',system-ui,sans-serif;font-weight:700;font-size:19px;color:#f08040">{{ dateLine }}</div>
<div style="font-family:'Quicksand',system-ui,sans-serif;font-weight:700;font-size:15px;color:#00a0d0">alpe-plaisance.org</div>
</div>
</div>
</div>

<div style="flex:0 0 auto">
<div style="font-family:'Quicksand',system-ui,sans-serif;font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#6b7883;margin-bottom:12px">Story — 1080 × 1920</div>
<div style="width:326px;height:580px;background:#ffffff;border-radius:18px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 10px 28px rgba(3,59,83,.12)">
<div style="background:#f08040;height:210px;display:flex;align-items:center;justify-content:center"><img src="../../assets/logo-alpe-v2-horizontal.png" alt="ALPE" style="height:96px;background:#fff;border-radius:12px;padding:10px 14px"></div>
<div style="padding:24px 26px 0;flex:1;display:flex;flex-direction:column">
<div style="font-family:'Quicksand',system-ui,sans-serif;font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#f08040">{{ kicker }}</div>
<div style="margin-top:12px;font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:38px;line-height:1.04;color:#005070;text-wrap:pretty">{{ title }}</div>
<svg viewBox="0 0 620 60" preserveAspectRatio="none" aria-hidden="true" style="width:100%;height:26px;margin-top:4px"><path d="M4 50 C 150 14 420 4 616 8" fill="none" stroke="#ffe000" stroke-width="12" stroke-linecap="round"></path></svg>
<div style="margin-top:16px;font-size:15px;line-height:1.45;color:#3a444c">{{ line }}</div>
<div style="margin-top:auto;padding-bottom:24px">
<div style="background:#e8f6fc;border-radius:14px;padding:14px 16px;font-family:'Quicksand',system-ui,sans-serif;font-weight:700;font-size:16px;color:#005070">{{ dateLine }}</div>
<div style="margin-top:12px;display:flex;align-items:center;justify-content:space-between;color:#00a0d0;font-size:14px"><span style="font-family:'Quicksand',system-ui,sans-serif;font-weight:700">alpe-plaisance.org</span><span style="display:flex;gap:10px"><i class="fa-brands fa-facebook-f" aria-hidden="true"></i><i class="fa-brands fa-instagram" aria-hidden="true"></i></span></div>
</div>
</div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:700},&quot;kicker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Save the date&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Bourse Printemps 2026&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;line&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;10 000 articles à l'espace Monestié. Vêtements, jouets, livres, sport.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dateLine&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;18 &amp; 19 avril · 9h–18h&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      kicker: p.kicker ?? 'Save the date',
      title: p.title ?? 'Bourse Printemps 2026',
      line: p.line ?? "10 000 articles à l'espace Monestié. Vêtements, jouets, livres, sport.",
      dateLine: p.dateLine ?? '18 & 19 avril · 9h–18h',
    };
  }
}
</script>
</body>
</html>
