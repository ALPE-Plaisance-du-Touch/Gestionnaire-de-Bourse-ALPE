# Environnement de test dev-j - Bourse ALPE (NAS Synology)
#
# TLS et noms de domaine sont pris en charge par le reverse proxy de DSM :
# les conteneurs n'exposent que du HTTP en clair sur des ports hauts, DSM
# occupant déjà 80 et 443.
#
#   dev-j.bourse.alpe-plaisance.org         -> 127.0.0.1:8080
#   mailhog.dev-j.bourse.alpe-plaisance.org -> 127.0.0.1:8081
#
# Mise en route : voir docs/deploiement-nas-synology.md

services:
  db:
    image: mariadb:10.11
    container_name: bourse-devj-db
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - devj-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: bourse-devj-backend
    env_file:
      - .env.dev-j
    environment:
      DATABASE_URL: mysql+aiomysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devj-network
    restart: unless-stopped

  # Construit le SPA une fois puis se termine ; nginx sert le résultat.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build
    container_name: bourse-devj-frontend-build
    volumes:
      - frontend_build:/output
    entrypoint: ["sh", "-c", "rm -rf /output/* && cp -r /app/dist/* /output/"]
    networks:
      - devj-network

  nginx:
    image: nginx:1.27-alpine
    container_name: bourse-devj-nginx
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      - ./docker/nginx/nginx.dev-j.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ./docker/nginx/mailhog.htpasswd:/etc/nginx/mailhog.htpasswd:ro
      - frontend_build:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - mailhog
    networks:
      - devj-network
    restart: unless-stopped

  # Capture tous les courriels sortants : rien ne part vers de vraies adresses.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: bourse-devj-mailhog
    networks:
      - devj-network
    restart: unless-stopped

networks:
  devj-network:
    driver: bridge

volumes:
  db_data:
  frontend_build:
