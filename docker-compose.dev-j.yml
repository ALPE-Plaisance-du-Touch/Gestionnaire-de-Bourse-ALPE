# Environnement de test dev-j - Bourse ALPE (NAS Synology)
#
# Le routage et le TLS sont assurés par Traefik, déjà en place sur le NAS :
# les conteneurs ne parlent qu'en HTTP et se déclarent par des labels.
#
#   dev-j.bourse.alpe-plaisance.org         -> nginx:8080
#   mailhog.dev-j.bourse.alpe-plaisance.org -> nginx:8081
#
# Mise en route : voir docs/deploiement-nas-synology.md

services:
  db:
    image: mariadb:10.11
    container_name: bourse-devj-db
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - devj-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: bourse-devj-backend
    env_file:
      - .env.dev-j
    environment:
      DATABASE_URL: mysql+aiomysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devj-network
    restart: unless-stopped

  # Construit le SPA une fois puis se termine ; nginx sert le résultat.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build
    container_name: bourse-devj-frontend-build
    volumes:
      - frontend_build:/output
    entrypoint: ["sh", "-c", "rm -rf /output/* && cp -r /app/dist/* /output/"]
    networks:
      - devj-network

  nginx:
    image: nginx:1.27-alpine
    container_name: bourse-devj-nginx
    # Publiés sur la boucle locale uniquement, pour pouvoir diagnostiquer depuis
    # le NAS sans passer par Traefik. Rien n'est joignable depuis le réseau.
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      - ./docker/nginx/nginx.dev-j.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ./docker/nginx/mailhog.htpasswd:/etc/nginx/mailhog.htpasswd:ro
      - frontend_build:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - mailhog
    networks:
      - devj-network
      - web
    restart: unless-stopped
    labels:
      # Traefik tourne avec exposedByDefault=false : sans cette ligne, rien
      # n'est routé.
      - "traefik.enable=true"
      # Le conteneur est sur deux réseaux ; il faut désigner celui que Traefik
      # doit emprunter, sinon il peut choisir la mauvaise adresse.
      - "traefik.docker.network=web"

      # --- Application ---
      - "traefik.http.routers.devj-app.rule=Host(`dev-j.bourse.alpe-plaisance.org`)"
      - "traefik.http.routers.devj-app.entrypoints=websecure"
      - "traefik.http.routers.devj-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.devj-app.service=devj-app"
      - "traefik.http.services.devj-app.loadbalancer.server.port=8080"

      # --- MailHog ---
      - "traefik.http.routers.devj-mailhog.rule=Host(`mailhog.dev-j.bourse.alpe-plaisance.org`)"
      - "traefik.http.routers.devj-mailhog.entrypoints=websecure"
      - "traefik.http.routers.devj-mailhog.tls.certresolver=letsencrypt"
      - "traefik.http.routers.devj-mailhog.service=devj-mailhog"
      - "traefik.http.services.devj-mailhog.loadbalancer.server.port=8081"

  # Capture tous les courriels sortants : rien ne part vers de vraies adresses.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: bourse-devj-mailhog
    networks:
      - devj-network
    restart: unless-stopped

networks:
  devj-network:
    driver: bridge
  # Réseau de Traefik, créé par sa propre pile.
  web:
    external: true

volumes:
  db_data:
  frontend_build:
