# Environnement de test dev-j — Bourse ALPE
#
# Les images sont construites par GitHub Actions et publiées sur GHCR : la
# machine hôte ne compile rien, elle fait `docker compose pull` puis `up -d`.
# Ni source, ni git, ni contrainte de mémoire sur l'hôte.
#
#   ghcr.io/alpe-plaisance-du-touch/bourse-alpe-backend:dev-j
#   ghcr.io/alpe-plaisance-du-touch/bourse-alpe-frontend:dev-j
#
# Traefik, déjà en place sur le réseau externe `web`, termine le TLS et répartit :
#   dev-j.bourse.alpe-plaisance.org/api/*   -> backend:8000
#   dev-j.bourse.alpe-plaisance.org/*       -> frontend:80
#   mailhog.dev-j.bourse.alpe-plaisance.org -> mailhog:8025 (mot de passe)
#
# Aucun port n'est publié sur l'hôte : tout passe par Traefik.
#
# Procédure complète : docs/deploiement-nas-synology.md
#
# NOMENCLATURE  <projet>-<service>-<environnement>
#
# La clé de service est aussi le nom DNS interne : `alpebourse-db-devj` est
# l'hôte que le backend contacte. Compose refuse `${VAR}` dans une clé de
# service (le schéma est validé avant substitution), donc l'environnement y est
# écrit en dur — d'où un fichier par environnement, et non un fichier
# paramétré. Dupliquer ce fichier pour un nouvel étage demande de remplacer
# `devj` partout, `.env` compris.

name: alpebourse-devj

services:
  alpebourse-db-devj:
    image: mariadb:10.11
    # Redondant avec la clé de service, mais garantit le nom exact quel que
    # soit le nom de projet. À retirer sous Coolify, qui gère le nommage.
    container_name: alpebourse-db-devj
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD est obligatoire}
      MYSQL_DATABASE: ${DB_NAME:-bourse_devj}
      MYSQL_USER: ${DB_USER:-bourse}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est obligatoire}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      # La toute première initialisation de MariaDB — tables système, base,
      # utilisateur, puis redémarrage — prend une quarantaine de secondes sur le
      # disque d'un NAS. À 30s, le start_period expirait en plein milieu :
      # Compose déclarait la dépendance en échec et laissait backend et frontend
      # en « Created ». Le volume existant, les démarrages suivants sont
      # immédiats ; cette marge ne sert qu'au premier.
      start_period: 120s
    # Jamais exposée à Traefik.
    networks:
      - internal

  alpebourse-backend-devj:
    image: ghcr.io/alpe-plaisance-du-touch/bourse-alpe-backend:${IMAGE_TAG:-dev-j}
    container_name: alpebourse-backend-devj
    pull_policy: always
    restart: unless-stopped
    depends_on:
      alpebourse-db-devj:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+aiomysql://${DB_USER:-bourse}:${DB_PASSWORD}@alpebourse-db-devj:3306/${DB_NAME:-bourse_devj}
    networks:
      - internal
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      # Règle plus spécifique que celle du frontend : Traefik la classe d'office
      # avant, le préfixe /api est donc servi ici.
      - "traefik.http.routers.alpebourse-api-devj.rule=Host(`${PUBLIC_HOST:-dev-j.bourse.alpe-plaisance.org}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.alpebourse-api-devj.entrypoints=websecure"
      - "traefik.http.routers.alpebourse-api-devj.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.alpebourse-api-devj.loadbalancer.server.port=8000"
      # L'API est déjà montée sur /api/v1 : surtout pas de stripprefix.

  alpebourse-frontend-devj:
    image: ghcr.io/alpe-plaisance-du-touch/bourse-alpe-frontend:${IMAGE_TAG:-dev-j}
    container_name: alpebourse-frontend-devj
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - alpebourse-backend-devj
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.alpebourse-web-devj.rule=Host(`${PUBLIC_HOST:-dev-j.bourse.alpe-plaisance.org}`)"
      - "traefik.http.routers.alpebourse-web-devj.entrypoints=websecure"
      - "traefik.http.routers.alpebourse-web-devj.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.alpebourse-web-devj.loadbalancer.server.port=80"

  # Capture tous les courriels sortants : rien ne part vers une vraie adresse.
  # Le backend le joint par SMTP_HOST, à tenir aligné sur cette clé.
  alpebourse-mailhog-devj:
    image: mailhog/mailhog:v1.0.1
    container_name: alpebourse-mailhog-devj
    restart: unless-stopped
    networks:
      - internal
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.alpebourse-mailhog-devj.rule=Host(`${MAILHOG_HOST:-mailhog.dev-j.bourse.alpe-plaisance.org}`)"
      - "traefik.http.routers.alpebourse-mailhog-devj.entrypoints=websecure"
      - "traefik.http.routers.alpebourse-mailhog-devj.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.alpebourse-mailhog-devj.loadbalancer.server.port=8025"
      # MailHog n'a aucune authentification et affiche tous les courriels,
      # jetons d'invitation et liens de réinitialisation compris.
      - "traefik.http.routers.alpebourse-mailhog-devj.middlewares=alpebourse-mailhogauth-devj"
      - "traefik.http.middlewares.alpebourse-mailhogauth-devj.basicauth.users=${MAILHOG_BASICAUTH:?MAILHOG_BASICAUTH est obligatoire}"

networks:
  # Base et backend uniquement : Traefik n'y a pas accès.
  internal:
    driver: bridge
  # Réseau de Traefik, créé par sa propre pile.
  web:
    external: true

volumes:
  db-data:
