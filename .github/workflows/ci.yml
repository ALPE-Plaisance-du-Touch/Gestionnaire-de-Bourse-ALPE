name: CI

on:
  # Permanent branches plus personal ones (dev-j, ...), per the branch model in
  # .claude/rules/git-workflow.md.
  push:
    branches: [main, dev, 'dev-*']
  pull_request:
    branches: [main, dev]

# Cancel superseded runs on the same branch: only the latest push matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Blocking, and cheap: five version values had drifted apart (pyproject 0.1.0,
  # __init__ 0.1.0, main.py 1.0.0-rc hardcoded twice, package.json 0.0.0, 0.23 in the
  # docs). Once that happens "the displayed version is the deployed version" cannot be
  # trusted, and /health stops being a way to verify a deployment.
  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version files agree
        run: bash scripts/check-version-consistency.sh

  # Production runs on MariaDB while the default suite runs on in-memory SQLite,
  # which silently accepts what MariaDB rejects. This job caught two real defects
  # SQLite hid: a quoted CURRENT_TIMESTAMP default, and a value overflowing
  # decimal(5,4). Separate job so a MariaDB-only failure is legible at a glance.
  backend-mariadb:
    name: Backend (MariaDB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mariadb:
        image: mariadb:10.11
        env:
          # Throwaway CI credentials, deliberately named as such.
          MARIADB_ROOT_PASSWORD: ci-test-secret-not-a-real-credential
          MARIADB_DATABASE: bourse_test
          MARIADB_USER: bourse
          MARIADB_PASSWORD: ci-test-secret-not-a-real-credential
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libffi-dev shared-mime-info

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Non-blocking for the same reason as the SQLite run: 16 pre-existing failures.
      # Drop continue-on-error once the suite is green.
      - name: Test (pytest on MariaDB)
        env:
          TEST_DATABASE_URL: mysql+aiomysql://bourse:ci-test-secret-not-a-real-credential@127.0.0.1:3306/bourse_test
        run: pytest
        continue-on-error: true

  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version used by backend/Dockerfile.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # WeasyPrint (PDF generation) dlopen's these at import time, so pytest
      # cannot even collect without them. Kept in sync with backend/Dockerfile.
      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libffi-dev shared-mime-info

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Non-blocking for now: 706 pre-existing findings. Without this the job
      # stops here and never reaches pytest, which is the step worth watching.
      - name: Lint (ruff)
        run: ruff check .
        continue-on-error: true

      # Non-blocking for now: pyproject sets mypy strict = true on a codebase that
      # has never been typechecked in CI. Reported, not enforced, until the
      # backlog is cleared; then drop continue-on-error.
      - name: Typecheck (mypy)
        run: mypy app
        continue-on-error: true

      # Tests run against in-memory SQLite (see tests/conftest.py),
      # so no database service is needed here.
      #
      # Non-blocking for now: 16 pre-existing failures (338 pass). Most stem from
      # tests still building timezone-aware datetimes after fb02d10 deliberately
      # made the production code timezone-naive. Drop continue-on-error once the
      # suite is green, so regressions actually block a merge.
      - name: Test (pytest)
        run: pytest
        continue-on-error: true

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version used by frontend/Dockerfile.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Non-blocking for now: 22 pre-existing errors (react-hooks, unused vars)
      # predate this workflow. Making them blocking on day one would paint CI red
      # and teach the team to ignore it. Drop continue-on-error once cleared.
      - name: Lint (eslint)
        run: npm run lint
        continue-on-error: true

      # Blocking: the suite was repaired alongside this workflow and is green.
      # This is the one gate that actually protects the frontend today.
      - name: Test (vitest)
        run: npm test

      # Non-blocking for now: `tsc -b` reports pre-existing type errors
      # (duplicate ListType export, Recharts formatter signatures, a snake_case
      # payload in ActivatePage). Drop continue-on-error once they are fixed.
      - name: Build
        run: npm run build
        continue-on-error: true
